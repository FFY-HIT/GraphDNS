name: artifact-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build GraphDNS
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Run C++ smoke test
        run: ./build/semantic_graph --example --summary-only --timing --validate-invariants

      - name: Run experiment unit tests
        run: |
          python3 -m unittest discover -s experiments/experiment_01_census_consistency/tests -v
          python3 -m unittest discover -s experiments/experiment_02_symbolic_ablation/tests -v
          python3 -m unittest discover -s experiments/experiment_03_veridns_comparison/tests -v
          python3 -m unittest discover -s experiments/experiment_04_incremental_repair_equivalence/tests -v
          python3 -m unittest discover -s experiments/experiment_06_supplementary/tests -v

      - name: Run bounded evaluation smoke test
        run: |
          python3 experiments/experiment_02_symbolic_ablation/run_experiment.py \
            --output-dir /tmp/graphdns-exp02
          python3 experiments/experiment_03_veridns_comparison/run_experiment.py \
            --graphdns-binary build/semantic_graph \
            --output-dir /tmp/graphdns-exp03

      - name: Regenerate figures from frozen source data
        run: |
          python3 experiments/paper_figures/plot_all.py \
            --source-dir experiments/paper_figures/source_data \
            --output-dir /tmp/graphdns-figures
